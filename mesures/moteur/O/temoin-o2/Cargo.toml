# Témoin O2 (lot O ; critères dans moteur/REPRISE-O.md, « Témoin O2 ») : la passe avant de
# trc-modele, par le moteur entier (chemin T) et seule avec des experts tirés du GGUF (chemin G),
# contre la chaîne du lot K (mesures/moteur/K/k3/k3-chaine-gptoss20b.csv), ligne pour ligne.
#
# Outil hors de l'espace de travail du moteur (comme temoin-k3) : les crates du moteur sont prises par
# chemin, leurs `x.workspace = true` se résolvent dans moteur/Cargo.toml. Dépendance directe de la
# couture D seulement (§ 2.4) : anyhow.
[package]
name = "temoin-o2"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[dependencies]
trc-ordo = { path = "../../../../moteur/crates/trc-ordo" }
trc-modele = { path = "../../../../moteur/crates/trc-modele" }
trc-noyaux = { path = "../../../../moteur/crates/trc-noyaux" }
trc-cuda = { path = "../../../../moteur/crates/trc-cuda" }
trc-es = { path = "../../../../moteur/crates/trc-es" }
trc-format = { path = "../../../../moteur/crates/trc-format" }
trc-reference = { path = "../../../../moteur/crates/trc-reference" }
anyhow = "=1.0.104"

[profile.release]
opt-level = 3
debug = "line-tables-only"

[workspace]
