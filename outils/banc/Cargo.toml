[package]
name = "banc"
version = "0.1.0"
edition = "2024"
publish = false
description = "Banc de mesure de chaque étage de la machine : disque, RAM, PCIe, VRAM, calcul."

# Dépendances : toutes déjà dans le cache cargo de la machine (construction --offline).
# windows-sys : MIT OU Apache-2.0. wgpu : MIT OU Apache-2.0. pollster : MIT OU Apache-2.0.
# bytemuck : Zlib OU Apache-2.0 OU MIT. half : MIT OU Apache-2.0.
[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_System_Ioctl",
    "Win32_System_ProcessStatus",
] }
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = "1.25.2"
half = "2.7.1"

[profile.release]
opt-level = 3
debug = false
codegen-units = 16
lto = false
