# KL d'une recette substituée (sujet genome) : copie de la fourche de l'éclaireur, plus la substitution F32.
[package]
name = "genome-recette-kl"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
trc-reference = { path = "../../../moteur/crates/trc-reference" }
trc-juge = { path = "../../../moteur/crates/trc-juge" }
trc-jetons = { path = "../../../moteur/crates/trc-jetons" }
rayon = "=1.12.0"
half = "=2.7.1"
anyhow = "=1.0.104"
serde_json = "=1.0.151"

[profile.release]
opt-level = 3
debug = "line-tables-only"
